# Môi trường chạy đầy đủ: SQL Server + API + Web (nginx).
# Chỉ chạy database để dev:  docker compose up -d db
name: englishcenter

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Dev_Passw0rd!}
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db;Database=EnglishCenter;User Id=sa;Password=${DB_PASSWORD:-Dev_Passw0rd!};TrustServerCertificate=True"
      Database__InitMode: Migrate
      Database__Seed: ${SEED_DATA:-true}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-compose-signing-key-change-me-in-production-0123456789}
      FileStorage__RootPath: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  db-data:
  uploads:
